                  message:
                    type: string
          description: OK - Successful request with response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                      - message
                      properties:
                        message:
                          type: string
                  message:
                    type: string
          description: The server encountered an unexpected condition that prevented it from fulfilling the request. Report the issue to the support team if it persists.
      operationId: getAllProviders
    post:
      tags:
      - provider-service
      summary: Create a provider
      security:
      - BearerJwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                title: CreateAProviderCreated
                required:
                - message
                - data
                properties:
                  data:
                    type: object
                    required:
                    - provider
                    properties:
                      provider:
                        $ref: '#/components/schemas/Provider'
                  message:
                    type: string
          description: Created - Resource successfully created
        '400':
          content:
            application/json:
              schema:
                type: object
                title: CreateAProviderBadRequest
                required:
                - message
                properties:
                  message:
                    type: string
          description: The server could not understand the request due to invalid syntax. The client should modify the request and try again.
        '401':
          content:
            application/json:
              schema:
                type: object
                title: CreateAProviderUnauthorized
                required:
                - message
                properties:
                  message:
                    type: string
          description: Authentication is required to access the requested resource. The client must include the appropriate credentials.
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerErrror'
      parameters: []
      description: This api is to create a new provider
      operationId: createAProvider
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - email
              - mobilePhoneNumber
              - isOkToText
              - password
              - confirmPassword
              - gender
              - source
              properties:
                email:
                  type: string
                gender:
                  oneOf:
                  - enum:
                    - Male
                    - Female
                    - PreferNotToSay
                    type: string
                    description: ''
                source:
                  oneOf:
                  - enum:
                    - SocialMedia
                    - DirectOutreach
                    - Online
                    - JobPosting
                    - Referral
                    - Others
                    type: string
                    description: ''
                lastName:
                  type: string
                password:
                  type: string
                firstName:
                  type: string
                isOkToText:
                  type: boolean
                confirmPassword:
                  type: string
                mobilePhoneNumber:
                  type: string
        required: true
        description: ''
