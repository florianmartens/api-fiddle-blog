openapi: 3.1.0
info:
  title: APIFiddle Sample Definition
  version: 0.0.0
  description: Example workspace
paths:
  /students:
    get:
      tags:
      - student-service
      summary: Get all students
      security:
      - BearerJwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                title: GetAllStudentsOk
                required:
                - message
                - data
                properties:
                  data:
                    type: object
                    required:
                    - students
                    properties:
                      students:
                        type: array
                        items:
                          $ref: '#/components/schemas/Student'
                  message:
                    type: string
          description: OK - Successful request with response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerErrror'
      parameters: []
      operationId: getAllStudents
    post:
      tags:
      - student-service
      summary: Create a student
      security:
      - BearerJwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - message
                properties:
                  data:
                    type: object
                    required:
                    - student
                    properties:
                      student:
                        $ref: '#/components/schemas/Student'
                  message:
                    type: string
          description: The request was successful, and a new resource was created.
        '400':
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
          description: The server could not understand the request due to invalid syntax. The client should modify the request and try again.
        '401':
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
          description: Authentication is required to access the requested resource. The client must include the appropriate credentials.
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerErrror'
      parameters: []
      description: This api is to create a new student while registration
      operationId: createAStudent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - firstName
              - lastName
              - email
              - mobilePhoneNumber
              - password
              - source
              - isOkToText
              - gender
              - confirmPassword
              properties:
                email:
                  type: string
                gender:
                  oneOf:
                  - type: array
                    items:
                      enum:
                      - Male
                      - Female
                      - PreferNotToSay
                      type: string
                      description: ''
                source:
                  oneOf:
                  - type: array
                    items:
                      enum:
                      - SocialMedia
                      - University
                      - Online
                      - Referral
                      - Others
                      type: string
                      description: ''
                lastName:
                  type: string
                password:
                  type: string
                firstName:
                  type: string
                isOkToText:
                  type: boolean
                confirmPassword:
                  type: string
                mobilePhoneNumber:
                  type: string
        required: true
        description: ''
  /providers:
    get:
      tags:
      - provider-service
      summary: Get all providers
      security:
      - BearerJwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
