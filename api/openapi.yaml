components:
  schemas:
    Student:
      type: object
      required:
      - firstName
      - lastName
      - email
      - mobilePhoneNumber
      - isOkToText
      - gender
      - source
      - address
      - university
      - clinicalTrack
      - degreeProgram
      - anticipatedGraduationDate
      - id
      - studentId
      properties:
        id:
          type: string
        email:
          type: string
        gender:
          oneOf:
          - type: array
            items:
              enum:
              - Male
              - Female
              - PreferNotToSay
              type: string
              description: ''
        source:
          oneOf:
          - type: array
            items:
              enum:
              - SocialMedia
              - University
              - Online
              - Referral
              - Others
              type: string
              description: ''
        address:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        studentId:
          type: string
        isOkToText:
          type: boolean
        university:
          type: number
        clinicalTrack:
          type: array
          items:
            type: number
        degreeProgram:
          type: array
          items:
            type: number
        mobilePhoneNumber:
          type: string
        anticipatedGraduationDate:
          type: string
      description: Student model
    AuthData:
      type: object
      required:
      - token
      - userType
      - firstName
      - lastName
      - profilePic
      - id
      - status
      properties:
        id:
          type: number
        token:
          type: string
        status:
          oneOf:
          - enum:
            - Active
            - Inactive
            - Deleted
            type: string
            description: ''
        lastName:
          type: string
        userType:
          oneOf:
          - enum:
            - Provider
            - Student
            - Admin
            type: string
            description: ''
        firstName:
          type: string
        profilePic:
          type: string
      description: User authenitication response data
    Location:
      type: object
      required:
      - milesReadyToTravel
      - address
      properties:
        address:
          type: string
        comments:
          type: string
        isReadyToRelocate:
          type: boolean
        milesReadyToTravel:
          type: number
        relocationComments:
          type: string
      description: Location schema
    Provider:
      type: object
      required:
      - firstName
      - lastName
      - email
      - mobilePhoneNumber
      - gender
      - isOkToText
      - source
      - credentials
      - id
      - providerId
      properties:
        id:
          type: string
        email:
          type: string
        gender:
          oneOf:
          - enum:
            - Male
            - Female
            - PreferNotToSay
            type: string
            description: ''
        source:
          oneOf:
          - enum:
            - SocialMedia
            - DirectOutreach
            - Online
            - JobPosting
            - Referral
            - Others
            type: string
            description: ''
        lastName:
          type: string
        firstName:
          type: string
        isOkToText:
          type: boolean
        providerId:
          type: string
        credentials:
          type: array
          items:
            type: number
        mobilePhoneNumber:
          type: string
      description: ''
    ProviderSite:
      type: object
      required:
      - name
      - address
      - clinicalSetting
      - numberOfPatientsSeenADay
      - dressCode
      - doesEmploerPermitPercepting
      - phone
      - maxNumberOfStudentIntake
      - patientAgeGroup
      - isInpatient
      - isOutpatient
      - isTele
      - languagePreference
      - intakeStartDate
      - comments
      - lat
      - long
      properties:
        lat:
          type: number
        long:
          type: number
        name:
          type: string
        phone:
          type: string
        isTele:
          type: boolean
        address:
          type: string
        comments:
          type: string
        dressCode:
          type: array
          items:
            type: number
        isInpatient:
          type: boolean
        isOutpatient:
          type: boolean
        clinicalSetting:
          type: array
          items:
            type: number
        intakeStartDate:
          type: string
        patientAgeGroup:
          anyOf:
          - type: array
            items:
              enum:
              - AllAges
              - Infant
              - Pediatric
              - Adolescent
              - Adult
              - Geriatric
              type: string
              description: ''
        languagePreference:
          type: number
        maxNumberOfStudentIntake:
          type: number
        numberOfPatientsSeenADay:
          type: number
        doesEmploerPermitPercepting:
          type: boolean
      description: Schema for provider site
    StudentCreate:
      type: object
      properties:
        email:
          type: string
        lastName:
          type: string
        firstName:
          type: string
      description: Data transfer object for creating a new Student.
      x-fiddle-dto-info:
        baseSchemaName: Student
    StudentUpdate:
      type: object
      properties:
        email:
          type: string
        lastName:
          type: string
        firstName:
          type: string
      description: Data transfer object for updating all fields of an existing Student (PUT operation).
      x-fiddle-dto-info:
        baseSchemaName: Student
    StudentSummary:
      type: object
      properties:
        email:
          type: string
        lastName:
          type: string
        firstName:
          type: string
      description: A simplified representation of a Student, typically used in list views.
      x-fiddle-dto-info:
        baseSchemaName: Student
    StudentRotation:
      type: object
      required:
      - rotationNeeded
      - startDate
      - endDate
      - clinicalSettingsAccepted
      - hoursNeeded
      - paperworkDueDate
      - patientAgesPermitted
      - telePsychTeleHealthHoursPermitted
      properties:
        endDate:
          type: string
        startDate:
          type: string
        hoursNeeded:
          type: number
        rotationNeeded:
          type: number
        paperworkDueDate:
          type: string
        patientAgesPermitted:
          anyOf:
          - type: array
            items:
              enum:
              - AllAges
              - Infant
              - Pediatric
              - Adolescent
              - Adult
              - Geriatric
              type: string
              description: ''
        clinicalSettingsAccepted:
          type: array
          items:
            type: number
        mustHaveProviderCredentials:
          type: array
          items:
            type: number
        telePsychTeleHealthHoursPermitted:
          type: number
      description: Student rotation schema
    StudentPartialUpdate:
      type: object
      properties:
        email:
          type: string
        lastName:
          type: string
        firstName:
          type: string
      description: Data transfer object for partially updating an existing Student (PATCH operation).
      x-fiddle-dto-info:
        baseSchemaName: Student
